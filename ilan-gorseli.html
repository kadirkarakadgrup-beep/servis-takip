<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İlan Görseli Yapıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#097681;--dk:#054852;--gold:#c6a56f;--lt:#d6eef0;--bg:#06333b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Poppins,'Segoe UI',Arial,sans-serif;padding:16px;max-width:620px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 14px;color:var(--gold)}
.card{background:var(--dk);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--lt);margin:12px 0 5px}
input[type=text],textarea,input[type=password]{width:100%;background:#fff;color:var(--dk);border:0;border-radius:12px;padding:11px 12px;font:500 16px Poppins,Arial,sans-serif}
textarea{min-height:88px;resize:vertical;line-height:1.45}
button{font:700 16px Poppins,Arial,sans-serif;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;width:100%}
.main{background:var(--gold);color:var(--dk)}
.alt{background:transparent;color:#fff;border:2px solid var(--gold)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.pick{display:block;text-align:center;background:var(--gold);color:var(--dk);border-radius:14px;padding:16px;font-weight:700;cursor:pointer}
.pick input{display:none}
.msg{font-size:14px;margin:10px 0 0;min-height:20px;color:var(--lt)}
.msg.err{color:#ffb4a8}
canvas{width:100%;height:auto;border-radius:14px;display:block;background:var(--teal)}
details summary{cursor:pointer;color:var(--lt);font-size:14px}
small{color:var(--lt);opacity:.8}
.hint{font-size:12px;color:var(--lt);opacity:.8;margin-top:6px}
</style>
</head>
<body>
<h1>İlan görseli yapıcı</h1>

<div class="card">
  <label class="pick" for="file" style="margin:0">📷 İlan ekran görüntüsünü seç<input id="file" type="file" accept="image/*"></label>
  <div id="msg" class="msg"></div>
  <details style="margin-top:10px">
    <summary>Ayarlar</summary>
    <label>Gemini API anahtarı</label>
    <input id="key" type="password" placeholder="aistudio.google.com/apikey">
    <div class="hint">Anahtar sadece bu telefonda saklanır.</div>
    <label>Alt yazı (görselin en altı)</label>
    <input id="footer" type="text" value="İzmir İş İlanları Time">
  </details>
</div>

<div class="card" id="form">
  <label style="margin-top:0">Başlık</label>
  <input id="headline" type="text" value="PERSONEL ARANIYOR!">
  <label>Konum</label>
  <input id="location" type="text" value="Karşıyaka / Hilltown AVM">
  <label>Kısa açıklama</label>
  <input id="subtitle" type="text" value="Yeni açılacak restoranımıza ekip arıyoruz">
  <label>Pozisyonlar (her satıra bir tane)</label>
  <textarea id="positions">Komi / Garson
Çaycı (Kadın, 18-40 yaş)
Salatacı (Kadın, 18-40 yaş)
Şef Garson</textarea>
  <label>Çalışma şartları (her satıra bir tane)</label>
  <textarea id="conditions">Günlük 7,5 saat net çalışma
1 saat mola
Net maaş
Yemek
Tip
Kurumsal haklar</textarea>
  <label>Telefonlar (her satıra bir tane)</label>
  <textarea id="phones" style="min-height:64px">0536 743 34 84
0536 353 69 02</textarea>
  <div style="height:14px"></div>
  <button class="main" id="make">Görseli oluştur</button>
</div>

<div class="card">
  <canvas id="cv" width="1080" height="1350"></canvas>
  <div style="height:12px"></div>
  <div class="row">
    <button class="main" id="dl">İndir</button>
    <button class="alt" id="share">Paylaş</button>
  </div>
</div>

<div class="card">
  <label style="margin-top:0">Instagram açıklaması</label>
  <textarea id="caption" style="min-height:150px"></textarea>
  <div style="height:10px"></div>
  <button class="alt" id="copy">Açıklamayı kopyala</button>
</div>

const store={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};
}

const font=(w,s)=>`${w} ${Math.round(s)}px Poppins,'Segoe UI',Arial,sans-serif`;
const lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
const upperTr=s=>s.toLocaleUpperCase('tr-TR');

function fit(ctx,text,weight,size,maxW){
  let s=size; ctx.font=font(weight,s);
  while(s>16&&ctx.measureText(text).width>maxW){s-=1;ctx.font=font(weight,s);}
  return s;
}

function layout(ctx,d,s){
  const chips=[]; let chipsH=0;
  if(d.conditions.length){
    ctx.font=font(500,27*s);
    let x=0,y=0; const rowH=52*s,gap=12*s;
    d.conditions.forEach(t=>{
      const w=ctx.measureText(t).width+44*s;
      if(x>0&&x+w>940){x=0;y+=rowH+gap;}
      chips.push({t,x,y,w,h:rowH}); x+=w+14*s;
    });
    chipsH=y+rowH;
  }
  const posH=d.positions.length?(70*s+d.positions.length*55*s+15*s):0;
  const condH=d.conditions.length?(44*s+chipsH):0;
  return {chips,chipsH,posH,condH};
}

function draw(){
  const cv=$('cv'),ctx=cv.getContext('2d');
  const d={
    headline:$('headline').value.trim(),
    location:$('location').value.trim(),
    subtitle:$('subtitle').value.trim(),
    positions:lines('positions'),
    conditions:lines('conditions'),
    phones:lines('phones'),
    footer:$('footer').value.trim()
  };
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=C.teal; ctx.fillRect(0,0,W,H);
  ctx.textBaseline='middle'; ctx.textAlign='left';

  // emblem
  if(logo.complete&&logo.naturalWidth) ctx.drawImage(logo,(W-250)/2,20,250,214);

  // headline
  const hl=upperTr(d.headline||'PERSONEL ARANIYOR!');
  const sp=hl.lastIndexOf(' ');
  const l1=sp>0?hl.slice(0,sp):'', l2=sp>0?hl.slice(sp+1):hl;
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  if(l1){
    const f1=fit(ctx,l1,700,112,960); ctx.font=font(700,f1); ctx.fillStyle=C.wh; ctx.fillText(l1,W/2,369);
  }
  const f2=fit(ctx,l2,700,112,960); ctx.font=font(700,f2); ctx.fillStyle=C.gold; ctx.fillText(l2,W/2,l1?475:430);

  // location pill
  ctx.textBaseline='middle';
  if(d.location){
    ctx.fillStyle=C.wh; ctx.beginPath(); ctx.roundRect(90,505,900,80,40); ctx.fill();
    ctx.fillStyle=C.gold; ctx.beginPath(); ctx.arc(141,545,16,0,7); ctx.fill();
    ctx.fillStyle=C.wh; ctx.beginPath(); ctx.arc(141,545,6,0,7); ctx.fill();
    ctx.textAlign='left'; ctx.fillStyle=C.dk;
    const fs=fit(ctx,d.location,700,38,770); ctx.font=font(700,fs); ctx.fillText(d.location,180,547);
  }
  if(d.subtitle){
    ctx.textAlign='center'; ctx.fillStyle=C.lt;
    const fs=fit(ctx,d.subtitle,500,29,960); ctx.font=font(500,fs); ctx.fillText(d.subtitle,W/2,614);
  }

  // phone box geometry (bottom)
  const n=d.phones.length;
  const cols=n<=3?Math.max(n,1):2, rows=Math.max(1,Math.ceil(n/cols));
  const boxH=100+(rows-1)*52, boxBottom=1295, boxTop=boxBottom-boxH;

  // choose scale so the middle part fits
  const startY=665, avail=boxTop-20-startY;
  let s=1,L=layout(ctx,d,s);
  const sections=(d.positions.length?1:0)+(d.conditions.length?1:0);
  const gapBase=sections>1?30:0;
  while(s>0.6&&(L.posH+L.condH+gapBase)>avail){s-=0.04;L=layout(ctx,d,s);}
  const extra=Math.max(0,avail-(L.posH+L.condH+gapBase));
  let y=startY+extra*0.25;
  const gap=gapBase+extra*0.4;

  // positions card
  if(d.positions.length){
    ctx.fillStyle=C.wh; ctx.beginPath(); ctx.roundRect(60,y,960,L.posH,36*s); ctx.fill();
    ctx.textAlign='left'; ctx.fillStyle='#a07d3c'; ctx.font=font(700,28*s);
    ctx.fillText('AÇIK POZİSYONLAR',100,y+32*s);
    d.positions.forEach((p,i)=>{
      const cy=y+70*s+i*55*s+22*s;
      ctx.fillStyle=C.teal; ctx.beginPath(); ctx.arc(118,cy,18*s,0,7); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=5*s; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(118-10*s,cy+1*s); ctx.lineTo(118-2*s,cy+9*s); ctx.lineTo(118+11*s,cy-8*s); ctx.stroke();
      ctx.fillStyle=C.dk; const fs=fit(ctx,p,500,35*s,830); ctx.font=font(500,fs);
      ctx.fillText(p,156,cy+1);
    });
    y+=L.posH+gap;
  }

  // conditions
  if(d.conditions.length){
    ctx.textAlign='left'; ctx.fillStyle=C.gold; ctx.font=font(700,28*s);
    ctx.fillText('ÇALIŞMA ŞARTLARI',70,y+14*s);
    const cy0=y+44*s;
    L.chips.forEach(c=>{
      ctx.fillStyle=C.dk; ctx.beginPath(); ctx.roundRect(70+c.x,cy0+c.y,c.w,c.h,26*s); ctx.fill();
      ctx.strokeStyle=C.gold; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle=C.wh; ctx.font=font(500,27*s); ctx.fillText(c.t,70+c.x+22*s,cy0+c.y+c.h/2+1);
    });
  }

  // phone box
  ctx.fillStyle=C.gold; ctx.beginPath(); ctx.roundRect(60,boxTop,960,boxH,30); ctx.fill();
  ctx.fillStyle=C.dk; ctx.textAlign=n===1?'center':'left'; ctx.font=font(500,22);
  ctx.fillText('BAŞVURU İÇİN ARA',n===1?W/2:100,boxTop+22);
  const colW=880/cols, nf=cols===3?34:40;
  d.phones.forEach((p,i)=>{
    const r=Math.floor(i/cols), c=i%cols;
    ctx.font=font(700,nf); ctx.fillStyle=C.dk;
    ctx.fillText(p,n===1?W/2:100+c*colW,boxTop+66+r*52);
  });

  // footer
  if(d.footer){ctx.textAlign='center';ctx.fillStyle=C.lt;ctx.font=font(500,24);ctx.fillText(d.footer,W/2,1325);}

  makeCaption(d);
}

function makeCaption(d){
  const loc=d.location||'';
  const l=[];
  l.push('📢 '+(d.headline||'PERSONEL ARANIYOR!'));
  if(loc) l.push('📍 '+loc);
  if(d.subtitle) l.push('',d.subtitle);
  if(d.positions.length){l.push('','👥 Açık pozisyonlar:');d.positions.forEach(p=>l.push('✅ '+p));}
  if(d.conditions.length){l.push('','⏰ Çalışma şartları:');d.conditions.forEach(p=>l.push('• '+p));}
  if(d.phones.length){l.push('','📞 Başvuru için:');d.phones.forEach(p=>l.push(p));}
  l.push('','📲 Daha fazla ilan için takipte kal!');
  const tag=s=>'#'+s.toLocaleLowerCase('tr-TR').replace(/[^a-z0-9çğıöşü]/gi,'');
  const tags=['#izmiriş','#izmirişilanları','#izmirpersonel','#işarıyorum'];
  loc.split(/[\/,–-]/).map(x=>x.trim()).filter(Boolean).forEach(x=>tags.push(tag(x+' iş ilanları')));
  l.push('',tags.join(' '));
  $('caption').value=l.join('\n');
}

const PROMPT=`Bu bir iş ilanı ekran görüntüsü. İlandaki bilgileri oku ve SADECE şu JSON'u döndür:
{"headline":"büyük harfle kısa başlık, örn. PERSONEL ARANIYOR!","location":"kısa konum, örn. Karşıyaka / Hilltown AVM","subtitle":"ilanın ne olduğunu anlatan tek kısa cümle, yoksa boş","positions":["pozisyon (varsa cinsiyet/yaş notu parantez içinde kısa)"],"conditions":["çalışma şartı veya imkan, maaş yazıyorsa o da"],"phones":["0536 743 34 84 biçiminde telefon"]}
Kurallar: Sadece görüntüde yazanı kullan, hiçbir şey uydurma. Emoji kullanma. Kanal adı, saat, görüntüleme sayısı, reklam gibi ilan dışı yazıları alma. Telefon rakamlarını dikkatle oku. Bulamadığın alan için boş dizi veya boş metin ver.`;

function toJpeg(file,max=1280){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.85).split(',')[1]);};
    img.onerror=()=>rej(new Error('Fotoğraf açılamadı'));img.src=u;
  });
}

async function askGemini(b64,onTry){
  const key=$('key').value.trim();
  if(!key) throw new Error('Önce Ayarlar bölümüne Gemini API anahtarını yaz.');
  store.set('ilan_gemini_key',key);
  const models=['gemini-2.5-flash','gemini-flash-latest','gemini-2.5-flash-lite','gemini-2.0-flash'];
  const body=JSON.stringify({contents:[{parts:[{text:PROMPT},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json',temperature:0.1}});
  let last='';
  for(let round=0;round<3;round++){
    for(const m of models){
      let r,j;
      try{
        r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body});
        j=await r.json().catch(()=>({}));
      }catch(e){last='Bağlantı hatası';continue;}
      if(r.ok){
        const t=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
        if(!t){last='boş yanıt';continue;}
        try{return JSON.parse(t.replace(/```json|```/g,'').trim());}catch(e){last='yanıt okunamadı';continue;}
      }
      const msg=(j.error&&j.error.message)||String(r.status);
      if([400,401,403].includes(r.status)&&/API key|permission|invalid/i.test(msg)) throw new Error('Gemini anahtarı geçersiz: '+msg);
      last=msg; // 404, 429, 500, 503: sıradaki modeli dene
    }
    if(round<2){ if(onTry) onTry(round+2); await new Promise(res=>setTimeout(res,2500*(round+1))); }
  }
  throw new Error('Gemini şu an yoğun, birkaç dakika sonra tekrar dene. ('+last+')');
}

$('file').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const m=$('msg'); m.className='msg'; m.textContent='⏳ İlan okunuyor…';
  try{
    const out=await askGemini(await toJpeg(f),n=>{m.textContent='⏳ Gemini yoğun, tekrar deniyorum ('+n+'/3)…';});
    const arr=v=>Array.isArray(v)?v.map(x=>String(x).trim()).filter(Boolean):[];
    if(out.headline) $('headline').value=String(out.headline).trim();
    $('location').value=String(out.location||'').trim();
    $('subtitle').value=String(out.subtitle||'').trim();
    $('positions').value=arr(out.positions).join('\n');
    $('conditions').value=arr(out.conditions).join('\n');
    $('phones').value=arr(out.phones).join('\n');
    m.textContent='✅ Okundu. Özellikle telefon numaralarını kontrol et, sonra görseli oluştur.';
    await fontsReady(); draw();
    $('form').scrollIntoView({behavior:'smooth'});
  }catch(err){m.className='msg err';m.textContent=err.message||String(err);}
});

// ---------- çıktı ----------
const fontsReady=()=>document.fonts?Promise.all([document.fonts.load('700 40px Poppins','İŞĞÇÖÜığşçöü'),document.fonts.load('500 40px Poppins','İŞĞÇÖÜığşçöü')]).catch(()=>{}):Promise.resolve();
const blob=()=>new Promise(r=>$('cv').toBlob(r,'image/png'));
$('make').onclick=async()=>{await fontsReady();draw();$('cv').scrollIntoView({behavior:'smooth'});};
$('dl').onclick=async()=>{
  await fontsReady();draw();
  const b=await blob(),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='ilan-'+Date.now()+'.png';a.click();
};
$('share').onclick=async()=>{
  await fontsReady();draw();
  const b=await blob(),f=new File([b],'ilan.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});}catch(e){}}
  else{$('dl').click();}
};
$('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText($('caption').value);}catch(e){$('caption').select();document.execCommand('copy');}
  $('copy').textContent='Kopyalandı';setTimeout(()=>$('copy').textContent='Açıklamayı kopyala',1600);
};
['headline','location','subtitle','positions','conditions','phones'].forEach(id=>$(id).addEventListener('input',()=>{clearTimeout(window._t);window._t=setTimeout(draw,250);}));

logo.onload=()=>fontsReady().then(draw);
fontsReady().then(draw);
</script>
